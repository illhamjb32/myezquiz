<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10132b">
<title>EZQuiz — Belajar jadi game</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
<div id="app" class="app-shell"></div>
<div id="toast" class="toast"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var me = null;
  var quizzes = [];
  var students = [];
  var activeView = 'home';
  var playState = null;
  var $ = function (selector, parent) { return (parent || document).querySelector(selector); };
  var esc = function (value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function api(path, data, method) {
    return fetch('/api' + path, {method: method || (data ? 'POST' : 'GET'), headers: data ? {'Content-Type':'application/json'} : {}, credentials:'same-origin', body:data ? JSON.stringify(data) : undefined}).then(function (r) { return r.json().then(function (body) { if (!r.ok) throw new Error(body.error || 'Terjadi kesalahan.'); return body; }); });
  }
  function toast(text) { var el = $('#toast'); el.textContent = text; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 2600); }
  function initials(name) { return String(name || '?').split(/\s+/).slice(0,2).map(function (part) { return part.charAt(0); }).join('').toUpperCase(); }
  function xpLevel(xp) { var level = Math.floor((xp || 0) / 500) + 1; return {level:level, current:(xp || 0) % 500, next:500}; }
  function authScreen(mode) {
    var register = mode === 'register';
    app.innerHTML = '<main class="auth-layout"><section class="auth-art"><a class="brand" href="/"><span class="brand-mark">⚡</span><span>ezquiz<small>LEARN. PLAY. LEVEL UP.</small></span></a><div class="art-copy"><span class="eyebrow">BELAJAR, NAIK LEVEL</span><h1>Belajar jadi<br><span>lebih seru.</span></h1><p>Latihan singkat, tantangan seru, dan XP yang bikin kamu terus maju.</p><div class="art-badges"><span>✦ Misi harian</span><span>⚡ XP & streak</span><span>🏆 Papan peringkat</span></div></div><div class="art-foot">Ruang belajar yang bikin ketagihan hal baik.</div></section><section class="auth-panel"><div class="auth-form"><div class="mobile-brand"><span class="brand-mark">⚡</span> ezquiz</div><span class="eyebrow">' + (register ? 'MULAI KELASMU' : 'SELAMAT DATANG KEMBALI') + '</span><h2>' + (register ? 'Buat akun guru' : 'Masuk ke EZQuiz') + '</h2><p class="subtle">' + (register ? 'Bangun kelas, buat kuis, dan ajak murid berkembang.' : 'Masuk untuk lanjut belajar dan kumpulkan XP.') + '</p><form id="authForm">' + (register ? '<label>Nama lengkap<input name="name" autocomplete="name" placeholder="cth. Bu Rani" required></label>' : '') + '<label>Username<input name="username" autocomplete="username" placeholder="username" minlength="3" required></label><label>Password<input name="password" type="password" autocomplete="' + (register ? 'new-password' : 'current-password') + '" minlength="8" placeholder="Minimal 8 karakter" required></label><div id="authError" class="form-error"></div><button class="button primary full" type="submit">' + (register ? 'Buat akun guru' : 'Masuk ke dashboard') + '<span>→</span></button></form><p class="auth-switch">' + (register ? 'Sudah punya akun?' : 'Guru baru?') + ' <button id="switchAuth" class="text-button">' + (register ? 'Masuk' : 'Buat akun guru') + '</button></p><div class="auth-note">Murid mendapat akun dari guru kelasnya.</div></div></section></main>';
    $('#switchAuth').onclick = function () { authScreen(register ? 'login' : 'register'); };
    $('#authForm').onsubmit = function (event) { event.preventDefault(); var form = new FormData(event.currentTarget); var data = Object.fromEntries(form.entries()); api(register ? '/register' : '/login', data).then(function (result) { me = result.user; loadDashboard(); }).catch(function (error) { $('#authError').textContent = error.message; }); };
  }
  function shell(content) {
    var level = xpLevel(me.xp);
    app.innerHTML = '<div class="dashboard"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">⚡</span><span>ezquiz<small>LEARN. PLAY. LEVEL UP.</small></span></a><div class="side-label">MENU UTAMA</div><nav class="side-nav"><button data-view="home" class="' + (activeView === 'home' ? 'active' : '') + '"><span>◫</span>Ringkasan</button>' + (me.role === 'teacher' ? '<button data-view="quizzes" class="' + (activeView === 'quizzes' ? 'active' : '') + '"><span>▤</span>Kuis & tugas</button><button data-view="students" class="' + (activeView === 'students' ? 'active' : '') + '"><span>♙</span>Murid</button>' : '<button data-view="assignments" class="' + (activeView === 'assignments' ? 'active' : '') + '"><span>▤</span>Kuis saya</button>') + '</nav><div class="sidebar-bottom"><div class="side-tip"><div class="tip-icon">✦</div><b>' + (me.role === 'teacher' ? 'Belajar lebih bermakna' : 'Terus jaga streak!') + '</b><p>' + (me.role === 'teacher' ? 'Kuis singkat bisa membuat latihan terasa menyenangkan.' : 'Sedikit progres setiap hari membawa hasil besar.') + '</p></div><button class="side-logout" id="logout">↪ <span>Keluar</span></button></div></aside><main class="main-area"><header class="topbar"><div><span class="eyebrow">' + (me.role === 'teacher' ? 'RUANG GURU' : 'RUANG BELAJAR') + '</span><h1>' + (activeView === 'home' ? 'Dashboard' : activeView === 'quizzes' || activeView === 'assignments' ? (me.role === 'teacher' ? 'Kuis & tugas' : 'Kuis saya') : 'Murid') + '</h1></div><div class="top-actions"><div class="top-xp"><span>' + (me.role === 'teacher' ? '♙</span> ' + students.length + ' murid' : '⚡</span> ' + (me.xp || 0).toLocaleString('id-ID') + ' XP') + '</div><div class="avatar">' + esc(initials(me.name)) + '</div><div class="user-short"><b>' + esc(me.name) + '</b><small>' + (me.role === 'teacher' ? 'Guru' : 'Level ' + level.level + ' student') + '</small></div></div></header><section class="page-content">' + content + '</section></main></div>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-view]'), function (button) { button.onclick = function () { activeView = button.getAttribute('data-view'); renderView(); }; });
    $('#logout').onclick = function () { api('/logout', {}).then(function () { me = null; authScreen('login'); }); };
  }
  function renderView() { if (!me) return; if (activeView === 'home') return me.role === 'teacher' ? teacherHome() : studentHome(); if (activeView === 'quizzes' && me.role === 'teacher') return teacherQuizzes(); if (activeView === 'students' && me.role === 'teacher') return teacherStudents(); if (activeView === 'assignments' && me.role === 'student') return studentHome(); teacherHome(); }
  function teacherHome() {
    Promise.all([api('/quizzes'), api('/students')]).then(function (results) { quizzes = results[0].quizzes; students = results[1].students; return api('/leaderboard').then(function (board) { shell('<div class="welcome-banner"><div class="banner-copy"><span class="eyebrow">SELAMAT DATANG KEMBALI</span><h2>Hai, ' + esc(me.name.split(' ')[0]) + ' <span>✦</span></h2><p>Siap bikin sesi belajar hari ini jadi lebih seru?</p><button class="button light" id="makeQuiz">＋ Buat kuis baru</button></div><div class="banner-graphic"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="trophy">🏆</div><span class="spark spark-one">✦</span><span class="spark spark-two">✧</span></div></div><div class="stats-grid"><article class="stat-card"><div class="stat-icon blue">▤</div><span>Total kuis</span><strong>' + quizzes.length + '</strong><small>Siap digunakan di kelas</small></article><article class="stat-card"><div class="stat-icon violet">♙</div><span>Total murid</span><strong>' + students.length + '</strong><small>Akun dalam kelasmu</small></article><article class="stat-card"><div class="stat-icon green">↗</div><span>XP kelas</span><strong>' + board.leaderboard.reduce(function (sum, student) { return sum + student.xp; }, 0).toLocaleString('id-ID') + '</strong><small>XP yang dikumpulkan murid</small></article></div><div class="content-grid"><article class="panel"><div class="panel-heading"><div><span class="eyebrow">KONTEN KELAS</span><h3>Kuis terbaru</h3></div><button class="text-button" id="allQuizzes">Lihat semua →</button></div>' + quizRows(quizzes.slice(0, 4), true) + '</article><article class="panel"><div class="panel-heading"><div><span class="eyebrow">PROGRES KELAS</span><h3>Murid teratas</h3></div><span class="trophy-small">🏆</span></div>' + leaderboardRows(board.leaderboard) + '</article></div>'); $('#makeQuiz').onclick = openQuizCreator; $('#allQuizzes').onclick = function () { activeView = 'quizzes'; renderView(); }; Array.prototype.forEach.call(app.querySelectorAll('.assign-open'), function (button) { button.onclick = function () { openAssign(Number(button.getAttribute('data-quiz'))); }; }); }); });
  }
  function studentHome() {
    Promise.all([api('/quizzes'), api('/leaderboard')]).then(function (results) { var assignments = results[0].assignments; var level = xpLevel(me.xp); shell('<div class="welcome-banner student-banner"><div class="banner-copy"><span class="eyebrow">RUANG BELAJARMU</span><h2>Terus berkembang, ' + esc(me.name.split(' ')[0]) + ' <span>✦</span></h2><p>Setiap jawaban benar membawamu satu langkah lebih dekat ke level berikutnya.</p><div class="level-progress"><div class="level-label"><span>LEVEL ' + level.level + '</span><span>' + level.current + ' / ' + level.next + ' XP</span></div><div class="level-track"><i style="width:' + (level.current / level.next * 100) + '%"></i></div></div></div><div class="banner-graphic"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="trophy">⚡</div><span class="spark spark-one">✦</span><span class="spark spark-two">✧</span></div></div><div class="stats-grid"><article class="stat-card"><div class="stat-icon yellow">⚡</div><span>Total XP</span><strong>' + (me.xp || 0).toLocaleString('id-ID') + '</strong><small>XP yang sudah kamu kumpulkan</small></article><article class="stat-card"><div class="stat-icon violet">✧</div><span>Level saat ini</span><strong>' + level.level + '</strong><small>' + (level.next - level.current) + ' XP menuju level berikutnya</small></article><article class="stat-card"><div class="stat-icon green">✓</div><span>Kuis tersedia</span><strong>' + assignments.filter(function (q) { return q.earnedXP == null; }).length + '</strong><small>Tantangan menantimu</small></article></div><div class="content-grid"><article class="panel"><div class="panel-heading"><div><span class="eyebrow">TANTANGAN KELAS</span><h3>Kuis untukmu</h3></div><span class="badge-count">' + assignments.length + ' kuis</span></div>' + studentQuizRows(assignments) + '</article><article class="panel"><div class="panel-heading"><div><span class="eyebrow">KELAS KITA</span><h3>Papan peringkat</h3></div><span class="trophy-small">🏆</span></div>' + leaderboardRows(results[1].leaderboard) + '</article></div>'); Array.prototype.forEach.call(app.querySelectorAll('[data-play]'), function (button) { button.onclick = function () { startQuiz(Number(button.getAttribute('data-play'))); }; }); });
  }
  function quizRows(list, teacher) { if (!list.length) return '<div class="empty-state"><div>▤</div><b>Belum ada kuis</b><p>Buat kuis pertamamu untuk memulai.</p></div>'; return '<div class="table-wrap"><table class="data-table"><thead><tr><th>JUDUL KUIS</th><th>SOAL</th><th>WAKTU</th><th></th></tr></thead><tbody>' + list.map(function (quiz) { return '<tr><td><div class="quiz-title"><span class="quiz-symbol">✦</span><span><b>' + esc(quiz.title) + '</b><small>' + esc(quiz.desc || 'Tanpa deskripsi') + '</small></span></div></td><td>' + quiz.questions.length + ' soal</td><td>' + quiz.timePerQ + ' dtk</td><td>' + (teacher ? '<button class="button small-button assign-open" data-quiz="' + quiz.id + '">Tugaskan →</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>'; }
  function studentQuizRows(list) { if (!list.length) return '<div class="empty-state"><div>✧</div><b>Belum ada tugas kuis</b><p>Guru akan menambahkan kuis untukmu di sini.</p></div>'; return '<div class="student-quiz-list">' + list.map(function (quiz) { var complete = quiz.earnedXP != null; return '<div class="student-quiz"><div class="quiz-symbol">' + (complete ? '✓' : '✦') + '</div><div class="student-quiz-copy"><b>' + esc(quiz.title) + '</b><small>' + quiz.questions.length + ' soal · ' + quiz.timePerQ + ' detik per soal' + (quiz.dueDate ? ' · Tenggat ' + esc(quiz.dueDate) : '') + '</small></div><div class="student-quiz-action">' + (complete ? '<span class="completed-tag">Selesai · +' + quiz.earnedXP + ' XP</span>' : '<button class="button small-button" data-play="' + quiz.assignmentId + '">Mulai →</button>') + '</div></div>'; }).join('') + '</div>'; }
  function leaderboardRows(list) { if (!list.length) return '<div class="empty-state compact"><div>🏆</div><b>Belum ada progres</b><p>Hasil belajar akan terlihat di sini.</p></div>'; return '<div class="leaderboard">' + list.map(function (student, index) { return '<div class="leader-row"><span class="rank rank-' + (index + 1) + '">' + (index + 1) + '</span><span class="avatar small-avatar">' + esc(initials(student.name)) + '</span><b>' + esc(student.name) + '</b><strong>⚡ ' + student.xp.toLocaleString('id-ID') + '</strong></div>'; }).join('') + '</div>'; }
  function teacherQuizzes() { api('/quizzes').then(function (result) { quizzes = result.quizzes; shell('<div class="section-intro"><div><span class="eyebrow">PUSTAKA BELAJAR</span><h2>Semua kuis kelasmu</h2><p>Buat latihan singkat, lalu tugaskan langsung kepada murid.</p></div><button class="button primary" id="makeQuiz">＋ Buat kuis</button></div><article class="panel">' + quizRows(quizzes, true) + '</article>'); $('#makeQuiz').onclick = openQuizCreator; Array.prototype.forEach.call(app.querySelectorAll('.assign-open'), function (button) { button.onclick = function () { openAssign(Number(button.getAttribute('data-quiz'))); }; }); }); }
  function teacherStudents() { api('/students').then(function (result) { students = result.students; shell('<div class="section-intro"><div><span class="eyebrow">KOMUNITAS KELAS</span><h2>Murid di kelasmu</h2><p>Kelola akun murid dan pantau XP yang mereka kumpulkan.</p></div><button class="button primary" id="addStudent">＋ Tambah murid</button></div><article class="panel"><div class="panel-heading"><div><span class="eyebrow">DAFTAR SISWA</span><h3>' + students.length + ' murid</h3></div></div>' + (students.length ? '<div class="table-wrap"><table class="data-table"><thead><tr><th>NAMA MURID</th><th>USERNAME</th><th>TOTAL XP</th></tr></thead><tbody>' + students.map(function (student) { return '<tr><td><div class="quiz-title"><span class="avatar small-avatar">' + esc(initials(student.name)) + '</span><b>' + esc(student.name) + '</b></div></td><td>' + esc(student.username) + '</td><td><strong>⚡ ' + student.xp.toLocaleString('id-ID') + '</strong></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty-state"><div>♙</div><b>Belum ada murid</b><p>Tambahkan akun murid agar bisa ditugaskan kuis.</p></div>') + '</article>'); $('#addStudent').onclick = openStudentCreator; }); }
  function modal(content) { var old = $('.modal-backdrop', app); if (old) old.remove(); var node = document.createElement('div'); node.className = 'modal-backdrop'; node.innerHTML = '<div class="modal-card">' + content + '</div>'; app.appendChild(node); node.addEventListener('click', function (event) { if (event.target === node) node.remove(); }); $('.modal-close', node).onclick = function () { node.remove(); }; return node; }
  function openStudentCreator() { var node = modal('<button class="modal-close" aria-label="Tutup">×</button><span class="eyebrow">AKUN KELAS</span><h2>Tambah murid</h2><p class="subtle">Bagikan username dan password ini kepada murid.</p><form id="studentForm"><label>Nama lengkap<input name="name" required placeholder="cth. Naya Putri"></label><label>Username<input name="username" required minlength="3" placeholder="cth. nayaputri"></label><label>Password awal<input type="password" name="password" required minlength="8" placeholder="Minimal 8 karakter"></label><div class="form-error" id="studentError"></div><button class="button primary full">Buat akun murid <span>→</span></button></form>'); $('#studentForm', node).onsubmit = function (event) { event.preventDefault(); api('/students', Object.fromEntries(new FormData(event.currentTarget).entries())).then(function () { node.remove(); toast('Akun murid berhasil dibuat'); teacherStudents(); }).catch(function (error) { $('#studentError', node).textContent = error.message; }); }; }
  function openQuizCreator() { var node = modal('<button class="modal-close" aria-label="Tutup">×</button><span class="eyebrow">BUAT MATERI LATIHAN</span><h2>Kuis baru</h2><p class="subtle">Tambahkan pertanyaan pilihan ganda untuk kelasmu.</p><form id="quizForm"><label>Judul kuis<input name="title" required placeholder="cth. Sains — Sistem tata surya"></label><label>Deskripsi<input name="desc" placeholder="Topik atau petunjuk singkat"></label><label>Waktu per soal (detik)<input name="timePerQ" type="number" min="5" max="120" value="20"></label><div id="questionFields"></div><button type="button" class="button secondary full add-question" id="addQuestion">＋ Tambah soal</button><div class="form-error" id="quizError"></div><button class="button primary full">Simpan kuis <span>→</span></button></form>'); var questions = []; function addQuestion() { var idx = questions.length; questions.push({q:'',options:['','','',''],answer:0,points:100}); var block = document.createElement('div'); block.className = 'question-editor'; block.innerHTML = '<div class="question-label">SOAL ' + (idx + 1) + '</div><label>Pertanyaan<input data-field="q" placeholder="Tulis pertanyaan" required></label><div class="option-fields">' + [0,1,2,3].map(function (option) { return '<label class="option-input"><input type="radio" name="answer-' + idx + '" value="' + option + '" ' + (option === 0 ? 'checked' : '') + '><input data-field="option" data-option="' + option + '" placeholder="Pilihan ' + (option + 1) + '" required></label>'; }).join('') + '</div>'; $('#questionFields', node).appendChild(block); } addQuestion(); $('#addQuestion', node).onclick = addQuestion; $('#quizForm', node).onsubmit = function (event) { event.preventDefault(); var blocks = $$('.question-editor', node); questions = blocks.map(function (block, index) { return {q:$('[data-field="q"]', block).value, options:Array.prototype.map.call(block.querySelectorAll('[data-field="option"]'), function (input) { return input.value; }), answer:Number($('input[name="answer-' + index + '"]:checked', block).value), points:100}; }); var form = Object.fromEntries(new FormData(event.currentTarget).entries()); api('/quizzes', {title:form.title, desc:form.desc, timePerQ:Number(form.timePerQ), questions:questions}).then(function () { node.remove(); toast('Kuis berhasil disimpan'); teacherQuizzes(); }).catch(function (error) { $('#quizError', node).textContent = error.message; }); }; }
  function openAssign(quizId) { Promise.all([api('/students'), api('/quizzes')]).then(function (results) { students = results[0].students; quizzes = results[1].quizzes; var node = modal('<button class="modal-close" aria-label="Tutup">×</button><span class="eyebrow">BAGIKAN TANTANGAN</span><h2>Tugaskan kuis</h2><p class="subtle">Pilih murid yang akan menerima kuis ini.</p>' + (!students.length ? '<div class="empty-state compact"><b>Tambahkan murid terlebih dahulu</b><p>Buat akun murid sebelum memberi tugas.</p></div>' : '<form id="assignForm"><label>Pilih murid<select name="student_id" required>' + students.map(function (student) { return '<option value="' + student.id + '">' + esc(student.name) + ' (@' + esc(student.username) + ')</option>'; }).join('') + '</select></label><label>Tenggat (opsional)<input type="date" name="due_date"></label><button class="button primary full">Kirim tugas <span>→</span></button></form>')); if ($('#assignForm', node)) $('#assignForm', node).onsubmit = function (event) { event.preventDefault(); var fields = Object.fromEntries(new FormData(event.currentTarget).entries()); fields.quiz_id = quizId; api('/assignments', fields).then(function () { node.remove(); toast('Kuis berhasil ditugaskan'); }); }; }); }
  function startQuiz(assignmentId) { api('/quiz/' + assignmentId).then(function (result) { playState = {assignment:result.assignment,index:result.assignment.currentQuestion,xp:result.assignment.attemptXP,streak:result.assignment.streak}; drawQuestion(); }).catch(function (error) { toast(error.message); }); }
  function drawQuestion() { var assignment = playState.assignment; var question = assignment.questions[0]; var node = modal('<div class="play-top"><span class="eyebrow">' + esc(assignment.title) + '</span><button class="modal-close" aria-label="Tutup">×</button></div><div class="play-progress"><i style="width:' + (playState.index / assignment.totalQuestions * 100) + '%"></i></div><div class="play-meta"><span>SOAL ' + (playState.index + 1) + ' DARI ' + assignment.totalQuestions + '</span><span>⚡ ' + playState.xp + ' XP</span></div><h2 class="play-question">' + esc(question.q) + '</h2><div class="play-options">' + question.options.map(function (option, index) { return '<button class="play-option" data-option="' + index + '"><span>' + String.fromCharCode(65 + index) + '</span>' + esc(option) + '</button>'; }).join('') + '</div><div class="play-timer">⏱ <span id="timerValue">' + assignment.timePerQ + '</span> detik tersisa</div>'); $('.modal-close', node).onclick = function () { if (confirm('Keluar dari kuis? Kamu bisa melanjutkan lagi nanti.')) { node.remove(); playState = null; studentHome(); } }; var answered = false; var remaining = assignment.timePerQ; var timer = setInterval(function () { remaining--; $('#timerValue', node).textContent = remaining; if (remaining <= 0) { clearInterval(timer); submitAnswer(-1); } }, 1000); Array.prototype.forEach.call($$('.play-option', node), function (button) { button.onclick = function () { if (!answered) { clearInterval(timer); submitAnswer(Number(button.getAttribute('data-option'))); } }; }); function submitAnswer(selected) { if (answered) return; answered = true; api('/answer/' + assignment.assignmentId, {answer:selected, question_index:playState.index}).then(function (result) { playState.xp = result.xp; playState.streak = result.streak; Array.prototype.forEach.call($$('.play-option', node), function (option) { option.disabled = true; var value = Number(option.getAttribute('data-option')); if (value === result.correctAnswer) option.classList.add('answer-correct'); else if (value === selected) option.classList.add('answer-wrong'); }); var feedback = document.createElement('div'); feedback.className = 'answer-feedback ' + (result.isCorrect ? 'good' : 'bad'); feedback.textContent = result.isCorrect ? 'Jawaban benar! +' + result.gain + ' XP' : 'Belum tepat, tetap semangat!'; $('.play-options', node).after(feedback); setTimeout(function () { node.remove(); if (result.finished) finishQuiz(result); else startQuiz(assignment.assignmentId); }, 900); }).catch(function (error) { clearInterval(timer); node.remove(); toast(error.message); playState = null; studentHome(); }); } }
  function finishQuiz(result) { me.xp += result.xp; playState = null; var pct = Math.round(result.correct / result.total * 100); var node = modal('<div class="finish-content"><div class="finish-icon">' + (pct === 100 ? '🏆' : '🎉') + '</div><span class="eyebrow">TANTANGAN SELESAI</span><h2>' + (pct === 100 ? 'Sempurna!' : 'Kerja bagus!') + '</h2><p class="subtle">Kamu menjawab benar ' + result.correct + ' dari ' + result.total + ' soal.</p><div class="finish-xp">+' + result.xp + ' <small>XP</small></div><button class="button primary full" id="finishClose">Kembali ke dashboard <span>→</span></button></div>'); $('#finishClose', node).onclick = function () { node.remove(); activeView = 'home'; studentHome(); }; }
  function $$(selector, parent) { return Array.prototype.slice.call((parent || document).querySelectorAll(selector)); }
  api('/me').then(function (result) { me = result.user; loadDashboard(); }).catch(function () { authScreen('login'); });
  function loadDashboard() { renderView(); }
})();
</script>
</body>
</html>
